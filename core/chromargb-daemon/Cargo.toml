[package]
name = "chromargb-daemon"
version = "0.1.0"
edition = "2021"

[dependencies]
chromargb-drivers = { path = "../chromargb-drivers" }
chromargb-effects = { path = "../chromargb-effects" }
futures-util = "0.3"
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.28"
